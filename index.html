<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>职业锚测评</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--red:#c8102e;--brown:#6b4f3a;--bg:#f7f5f2;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);color:#333;line-height:1.6;}
.container{max-width:520px;margin:0 auto;padding:16px;padding-bottom:120px;}
.header{text-align:center;padding:24px 0 12px;}
.header h1{font-size:24px;color:var(--red);}
.header p{font-size:13px;color:var(--brown);margin-top:4px;}
.card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.step{display:none;}
.step.active{display:block;}
.step-title{font-size:17px;font-weight:700;color:var(--red);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #eee;}
label{display:block;font-size:14px;color:#555;margin-bottom:6px;margin-top:12px;}
input[type=text],input[type=tel]{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
input:focus{outline:none;border-color:var(--red);}
.btn{display:block;width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;margin-top:18px;cursor:pointer;}
.btn:disabled{opacity:.6;}
.btn-secondary{background:#fff;color:var(--red);border:1px solid var(--red);margin-top:10px;}
.q{margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed #eee;}
.q-num{display:inline-block;background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;margin-right:6px;}
.q-text{font-size:14px;color:#333;margin-bottom:10px;}
.options{display:flex;justify-content:space-between;gap:4px;}
.options label{flex:1;text-align:center;margin:0;}
.options input{display:none;}
.options span{display:block;font-size:11px;color:#777;padding:8px 2px;border:1px solid #ddd;border-radius:6px;background:#fafafa;cursor:pointer;}
.options input:checked+span{background:var(--red);color:#fff;border-color:var(--red);}
.pick-item{padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;}
.pick-item input{display:none;}
.pick-item.checked{background:#fff0f2;border-color:var(--red);}
.pick-item .idx{font-weight:700;color:var(--red);}
.status{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
#progress{font-size:13px;color:var(--brown);}
.report-core{text-align:center;padding:20px;background:#fff0f2;border-radius:10px;margin-bottom:16px;}
.report-core h2{font-size:22px;color:var(--red);margin-bottom:6px;}
.report-core p{font-size:14px;color:var(--brown);}
.block{margin-bottom:14px;padding:14px;background:#fafafa;border-radius:8px;}
.block h3{font-size:15px;color:var(--red);margin-bottom:8px;}
.block p{font-size:13px;color:#444;margin-bottom:6px;}
.score-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #eee;}
.score-row b{color:var(--red);}
#errorBox{padding:40px 20px;text-align:center;color:#c8102e;display:none;}
#errorBox .sub{color:#6b4f3a;font-size:13px;margin-top:8px;}
.loading{text-align:center;padding:30px;color:#666;font-size:14px;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>职业锚测评</h1>
    <p>通用职业锚测评问卷（完整版）</p>
  </div>

  <div id="errorBox">
    <div id="errorText">加载失败</div>
    <div class="sub">请刷新页面重试，或换 Chrome/Safari/Edge 浏览器</div>
  </div>

  <div id="step1" class="step active card">
    <div class="step-title">第一步：基本信息</div>
    <label>姓名 *</label><input type="text" id="name" placeholder="请输入姓名">
    <label>手机号</label><input type="tel" id="phone" placeholder="请输入手机号">
    <label>部门/门店</label><input type="text" id="dept" placeholder="如：西安测试店">
    <label>岗位</label><input type="text" id="position" placeholder="如：管培生">
    <button class="btn" id="btn1" onclick="goStep(2)">下一步 · 开始测评</button>
  </div>

  <div id="step2" class="step card">
    <div class="step-title">第二步：40 题自评（1=完全不符合，6=完全符合）</div>
    <div id="qlist"></div>
    <button class="btn" id="btn2" onclick="goStep(3)" disabled>下一步 · 附加题</button>
  </div>

  <div id="step3" class="step card">
    <div class="step-title">第三步：选 3 道附加题（额外 +4 分）</div>
    <p style="font-size:13px;color:#666;margin-bottom:12px;">请选 3 道最符合你想法的题，每项都会给对应类型额外加 4 分。</p>
    <div id="picklist"></div>
    <button class="btn" id="btn3" onclick="submitAll()" disabled>提交并查看报告</button>
  </div>

  <div id="step4" class="step card">
    <div id="reportArea"></div>
    <button class="btn btn-secondary" onclick="location.reload()">重新测评</button>
  </div>

  <div class="status">
    <span id="progress">准备中...</span>
    <span id="stepInd" style="font-size:12px;color:#999;">1/4</span>
  </div>
</div>

<script>
/* 题库（内嵌） */
window.QUESTION_TEXTS = [
"我希望做自己擅长的工作，让专业建议持续被采纳。",
"整合并管理他人工作时，我会获得强烈成就感。",
"我希望工作能按自己的方式和计划开展。",
"对我而言，工作的安定稳定比自由自主更重要。",
"我总在寻找能创立自己事业的创意或点子。",
"只有对社会做出真正贡献的职业，才算是成功的职业。",
"我渴望在工作中解决有挑战性的问题并胜出。",
"若工作需要个人或家庭做出重大牺牲，我宁愿离开。",
"将技术/专业能力提升到高水平，是职业成功的必要条件。",
"我希望管理大型组织，让自己的决策影响更多人。",
"职业能让我自由决定工作内容、计划和过程，我会非常满意。",
"若工作会丧失组织内的安全稳定感，我宁愿离职。",
"创办自己的公司，比在他人公司争取高管职位更有意义。",
"职业满足感来自用自身才能为他人提供服务。",
"职业成就感源于克服极具挑战性的困难。",
"我希望职业能兼顾个人、家庭与工作的需求。",
"在喜欢的专业领域做资深专家，比当总经理更有吸引力。",
"只有成为公司总经理，我才认为职业人生是成功的。",
"成功的职业应给予我完全的自主与自由。",
"我倾向选择能提供安全感和稳定感的公司工作。",
"我希望能创立一家属于自己的企业或产品。",
"我认为帮助他人解决问题比个人晋升更重要。",
"我愿意接受高难度挑战，哪怕失败风险很高。",
"我希望工作与生活有清晰边界，不牺牲生活质量。",
"我偏好成为某个领域的技术权威，而非管理他人。",
"我希望在组织中担任越来越高的管理职位。",
"工作中拥有独立空间和决策权对我至关重要。",
"我希望长期在一家稳定的公司发展，不频繁跳槽。",
"创业即使失败，也比安稳打工更有价值。",
"我的职业选择常以能否帮助他人为首要标准。",
"我享受击败强对手、完成看似不可能的任务。",
"我宁愿选择压力小、能照顾家庭的岗位。",
"看到自身专业技能不断精进，是我最满足的事。",
"带领团队达成目标，比个人技术突破更让我兴奋。",
"我受不了被过度监督和指挥，喜欢自己掌控节奏。",
"我重视公司的长期稳定、制度完善与福利保障。",
"我希望将来有机会独立创业或做合伙人。",
"能为社会、客户或团队创造可见价值，我会很满足。",
"我喜欢不断挑战更高目标，讨厌一成不变。",
"家庭责任和个人生活质量会显著影响我的职业选择。"
];
window.ANCHOR_KEYS = ["技术/职能型","管理型","自主/独立型","安全/稳定型","创业型","服务/奉献型","挑战型","生活型"];
window.ANCHOR_DESC = {
"技术/职能型":{short:"深耕专业，成为领域专家",strength:["专业扎实、追求深度","持续学习、精益求精","解决问题靠专业"],tips:["寻找有专业纵深的工作","争取技术序列晋升","用专业成果建立影响力"]},
"管理型":{short:"整合资源，带领团队拿结果",strength:["善于协调与决策","享受领导与影响","看重组织地位"],tips:["主动承担项目管理","锻炼人员与资源调配","建立大局观与战略思维"]},
"自主/独立型":{short:"自己掌控节奏与方向",strength:["独立性强、厌恶被控","追求自由安排工作","靠自我驱动产出"],tips:["选择结果导向的岗位","争取弹性工作制度","用成果换取自主权"]},
"安全/稳定型":{short:"稳定平台，长期发展",strength:["忠诚稳健、重视保障","规避风险、守规矩","持续积累"],tips:["选择成熟稳定的企业","关注福利与职业通道","用稳定表现获得信任"]},
"创业型":{short:"从 0 到 1，创造自己的事业",strength:["创新嗅觉敏锐","敢冒险、善资源整合","享受不确定性"],tips:["关注新业务/新项目","积累商业与运营能力","寻找合伙人或创业窗口"]},
"服务/奉献型":{short:"帮助他人，创造社会价值",strength:["同理心强、乐于助人","使命感驱动","重视意义感"],tips:["选择服务/培训/公益属性岗位","把助人变成核心竞争力","在顾客/员工成长中找成就感"]},
"挑战型":{short:"战胜困难，突破极限",strength:["好胜心强、抗压","喜欢高难度任务","把不可能变可能"],tips:["主动争取有挑战的目标","把竞争当动力","注意避免过度冒险"]},
"生活型":{short:"平衡工作、家庭与生活",strength:["重视家庭与个人时间","善于协调多重角色","追求可持续"],tips:["选择尊重边界的企业","与上级沟通弹性安排","用效率换取生活质量"]}
};

function buildQuestions(){
  return QUESTION_TEXTS.map((t,i)=>({id:i+1,text:t,type:ANCHOR_KEYS[i%8]}));
}

var SCALE=[{v:1,l:'完全\n不符合'},{v:2,l:'偶尔\n符合'},{v:3,l:'有时\n符合'},{v:4,l:'经常\n符合'},{v:5,l:'频繁\n符合'},{v:6,l:'完全\n符合'}];
var SUPABASE_URL='https://ptfkmnenapowzafvqdch.supabase.co';
var PUBLISHABLE_KEY='sb_publishable_hN07YAXpyTEoCFoCMBdceg_Y1jElOPs';
var QUESTIONS=[];
var scores={};
var top3=[];

function computeReport(scores,top3){
  var sums={}, counts={};
  ANCHOR_KEYS.forEach(function(k){sums[k]=0; counts[k]=0;});
  QUESTIONS.forEach(function(q){
    var s=parseInt(scores[q.id],10)||0;
    if(s>=1&&s<=6){sums[q.type]+=s; counts[q.type]++;}
  });
  var avg={};
  ANCHOR_KEYS.forEach(function(k){avg[k]=counts[k]?sums[k]/counts[k]:0;});
  top3.forEach(function(idx){
    var q=QUESTIONS[idx-1];
    if(q) avg[q.type]=(avg[q.type]||0)+4;
  });
  var entries=ANCHOR_KEYS.map(function(k){return {type:k,score:+(avg[k].toFixed(2))};}).sort(function(a,b){return b.score-a.score;});
  var first=entries[0], second=entries[1];
  var cores=[first];
  if(second && Math.abs(first.score-second.score)<=0.5 && second.score>0) cores.push(second);
  return {avg:avg,cores:cores,dual:cores.length>1,core_names:cores.map(function(c){return c.type;}).join(' + ')};
}

function makeReportText(report){
  var blocks=report.cores.map(function(c){
    var d=ANCHOR_DESC[c.type];
    return {
      type:c.type, score:c.score, short:d.short,
      strength:d.strength, tips:d.tips
    };
  });
  return blocks;
}

function renderQ(){
  var box=document.getElementById('qlist'); box.innerHTML='';
  QUESTIONS.forEach(function(q,i){
    var d=document.createElement('div'); d.className='q';
    d.innerHTML='<div class="q-text"><span class="q-num">'+(i+1)+'</span>'+q.text+'</div>';
    var opts=document.createElement('div'); opts.className='options';
    SCALE.forEach(function(s){
      var lbl=document.createElement('label');
      lbl.innerHTML='<input type="radio" name="q'+q.id+'" value="'+s.v+'" onchange="setScore('+q.id+','+s.v+')"><span>'+s.l.replace(/\n/g,'<br>')+'</span>';
      opts.appendChild(lbl);
    });
    d.appendChild(opts); box.appendChild(d);
  });
}

function renderPick(){
  var box=document.getElementById('picklist'); box.innerHTML='';
  QUESTIONS.forEach(function(q,i){
    var d=document.createElement('div'); d.className='pick-item'; d.dataset.id=q.id; d.onclick=function(){togglePick(q.id)};
    d.innerHTML='<span class="idx">'+(i+1)+'</span><span>'+q.text+'</span>';
    box.appendChild(d);
  });
}

function setScore(id,v){scores[id]=v; updateProgress();}

function togglePick(id){
  var idx=top3.indexOf(id);
  if(idx>=0){top3.splice(idx,1);}else{if(top3.length<3) top3.push(id);}
  renderPickState();
  updateProgress();
}

function renderPickState(){
  document.querySelectorAll('.pick-item').forEach(function(el){
    var id=parseInt(el.dataset.id,10);
    if(top3.indexOf(id)>=0) el.classList.add('checked'); else el.classList.remove('checked');
  });
}

function updateProgress(){
  var answered=Object.keys(scores).length;
  document.getElementById('progress').textContent='已答 '+answered+'/40 题，附加题 '+top3.length+'/3';
  document.getElementById('btn2').disabled=answered<40;
  document.getElementById('btn3').disabled=top3.length<3;
}

function goStep(n){
  if(n===2){
    if(!document.getElementById('name').value.trim()){alert('请填写姓名'); return;}
  }
  if(n===3){
    var answered=Object.keys(scores).length;
    if(answered<40){alert('还有 '+(40-answered)+' 题未作答'); return;}
  }
  for(var i=1;i<=4;i++) document.getElementById('step'+i).classList.remove('active');
  document.getElementById('step'+n).classList.add('active');
  document.getElementById('stepInd').textContent=n+'/4';
  if(n===2) renderQ();
  if(n===3) renderPick();
}

async function postSubmission(payload,btn){
  var lastErr=null;
  for(var attempt=1;attempt<=3;attempt++){
    try{
      if(btn) btn.textContent='提交中...'+(attempt>1?'（第'+attempt+'次重试）':'');
      var ctrl=new AbortController();
      var tid=setTimeout(function(){ctrl.abort();},20000);
      var res=await fetch(SUPABASE_URL+'/rest/v1/submissions',{
        method:'POST',
        headers:{
          'apikey':PUBLISHABLE_KEY,
          'Authorization':'Bearer '+PUBLISHABLE_KEY,
          'Content-Type':'application/json',
          'Prefer':'return=minimal'
        },
        body:JSON.stringify(payload),
        signal:ctrl.signal
      });
      clearTimeout(tid);
      if(!res.ok){
        var err=await res.text();
        throw new Error('提交失败：'+res.status+' '+err);
      }
      return true;
    }catch(e){
      lastErr=e;
      if(attempt<3) await new Promise(function(r){setTimeout(r,2000*attempt);});
    }
  }
  throw lastErr;
}

async function submitAll(){
  var btn=document.getElementById('btn3');
  btn.disabled=true; btn.textContent='提交中...';
  try{
    var name=document.getElementById('name').value.trim();
    var phone=document.getElementById('phone').value.trim();
    var dept=document.getElementById('dept').value.trim();
    var position=document.getElementById('position').value.trim();
    var report=computeReport(scores,top3);
    var blocks=makeReportText(report);
    var payload={
      name:name, phone:phone, dept:dept, store:dept, position:position,
      scores:scores, top3:top3,
      core_names:report.core_names,
      report:{avg:report.avg,cores:report.cores,dual:report.dual,blocks:blocks}
    };
    await postSubmission(payload,btn);
    showReport(report, blocks);
    goStep(4);
  }catch(e){
    alert('网络不稳定，提交没有成功。你的答案还在，请点击"提交并查看报告"再试一次；如果还不行，请换个网络（如切换流量/WiFi）再试。');
    btn.disabled=false; btn.textContent='提交并查看报告';
  }
}

function showReport(report, blocks){
  var area=document.getElementById('reportArea');
  var html='<div class="report-core"><h2>你的核心职业锚</h2><p>'+report.core_names+'</p></div>';
  blocks.forEach(function(b){
    html+='<div class="block"><h3>'+b.type+' · '+b.short+'</h3>';
    html+='<p><b>优势：</b>'+b.strength.join('、')+'</p>';
    html+='<p><b>发展建议：</b>'+b.tips.join('；')+'</p></div>';
  });
  html+='<div class="card" style="margin-top:16px;"><h3 style="color:var(--red);margin-bottom:10px;">八锚得分</h3>';
  ANCHOR_KEYS.forEach(function(k){
    html+='<div class="score-row"><span>'+k+'</span><b>'+report.avg[k].toFixed(2)+'</b></div>';
  });
  html+='</div>';
  area.innerHTML=html;
}

try{
  QUESTIONS=buildQuestions(); ANCHORS=ANCHOR_KEYS;
  document.getElementById('progress').textContent='请先填写基本信息';
}catch(e){
  document.getElementById('errorBox').style.display='block';
  document.getElementById('errorText').textContent='题库加载失败：'+e.message;
}
</script>
</body>
</html>
